services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile  # Dockerfile을 참조하여 이미지 빌드
    working_dir: /app
    command: ["python3", "main.py"]
    volumes:
      - .:/app  # 호스트 디렉토리를 컨테이너의 /app에 마운트
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - AUTO_DISCONNECT_TIMEOUT=600
    depends_on:
      lavalink:
        condition: service_healthy
      pot-provider:
        condition: service_started

  # 기본 Lavalink 노드 (node1)
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    container_name: lavalink
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml
      - ./lavalink/plugins:/opt/Lavalink/plugins
    environment:
      - TZ=Asia/Seoul
      - _JAVA_OPTIONS=-Xmx512m
    ports:
      - "2333:2333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --header='Authorization: ${LAVALINK_PASSWORD}' http://localhost:2333/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # YouTube 서명 복호화 서버 (lavalink remoteCipher). 호스트 포트 미개방, 내부 네트워크 전용
  # 태그가 master뿐이라 digest로 고정 (2026-08-06 빌드)
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher@sha256:4c5ec381ff57336cfc24822d2b526a5ad7cd0171f61065a1bbc87bb736842449
    container_name: yt-cipher
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
      - OVERRIDE_PLAYER_VARIANT=IAS

  # YouTube poToken 발급 서버 (WEB/MWEB 스트림용). 인증 없는 서버라 호스트 포트 미개방, 내부 네트워크 전용
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:1.3.2-node
    container_name: pot-provider
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul

