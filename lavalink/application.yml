server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    # 1.18.2 이후 미릴리스 수정(클라이언트 버전, TV User-Agent, IOS, contentLength 누락 포맷 길이 복구) 포함 main 커밋 고정 (2026-08-19)
    - dependency: "dev.lavalink.youtube:youtube-plugin:f45bbb7aebfcbc1c553769e04af6cd43afa8b7c3"
      snapshot: true
      repository: "https://maven.lavalink.dev/snapshots"
  server:
    password: "${LAVALINK_PASSWORD}"
    sources:
      youtube: false
      soundcloud: false
      http: true
    playerUpdateInterval: 1

plugins:
  youtube:
    enabled: true
    oauth:
      enabled: false
    clients:
      - MUSIC
      - TVHTML5_SIMPLY
      - MWEB
      - ANDROID_VR
      - WEB
      - IOS
    remoteCipher:
      url: "http://yt-cipher:8001/"
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

metrics:
  prometheus:
    enabled: false

sentry:
  dsn: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
